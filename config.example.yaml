# RDS Diagnostics Tool - Example Configuration File
# Copy this file to ~/.rds-diagnostics/config.yaml or specify with --config flag

# AWS Profile (optional)
# If not specified, uses the default AWS CLI profile
# aws_profile: lt-prd

# Default AWS Region
# Default: ap-southeast-1 (Singapore)
default_region: ap-southeast-1

# Default Time Range for Metrics Collection
# Format: <number><h|d> where h=hours, d=days
# Examples: "1h" (1 hour), "24h" (24 hours), "7d" (7 days)
# Default: 1h
default_time_range: 1h

# Default Output Format
# Options: text, json
# Default: text
output_format: text

# Metric Thresholds
# These values determine when metrics are flagged as warnings or critical
# All percentage values should be between 0-100
thresholds:
  # CPU Utilization (percentage)
  cpu:
    warning: 70.0    # Warn when CPU exceeds 70%
    critical: 90.0   # Critical when CPU exceeds 90%
  
  # Memory Utilization (percentage of freeable memory)
  memory:
    warning: 80.0    # Warn when memory usage exceeds 80%
    critical: 95.0   # Critical when memory usage exceeds 95%
  
  # Database Connections (percentage of max_connections)
  connections:
    warning: 80      # Warn when connections exceed 80% of max
    critical: 95     # Critical when connections exceed 95% of max
  
  # IOPS (percentage of provisioned IOPS)
  iops:
    warning: 80.0    # Warn when IOPS usage exceeds 80%
    critical: 95.0   # Critical when IOPS usage exceeds 95%
  
  # Storage (percentage of allocated storage used)
  storage:
    warning: 80.0    # Warn when storage usage exceeds 80%
    critical: 90.0   # Critical when storage usage exceeds 90%

# Performance Insights Configuration
# Controls how the tool collects and processes Performance Insights data
# Note: This does NOT enable/disable Performance Insights on your RDS instance
# It only controls how this tool behaves when collecting data
performance_insights:
  # Enable/disable Performance Insights data collection in the tool
  # Default: true
  enabled: true
  
  # Maximum number of SQL queries to retrieve from Performance Insights
  # Range: 1-100
  # Default: 25
  max_queries: 25
  
  # Enable/disable enhanced metric collection (CPU time, lock time, I/O, rows)
  # If disabled, only basic query metrics are collected
  # Default: true
  collect_enhanced_metrics: true
  
  # Fallback to basic collection if enhanced metric collection fails
  # If true, continues with basic metrics when enhanced collection errors occur
  # If false, skips the query entirely on error
  # Default: true
  fallback_on_error: true
  
  # Control which enhanced metrics to collect (only applies if collect_enhanced_metrics is true)
  # These settings allow fine-grained control over which metrics are retrieved
  # Useful if certain metrics are not available for your engine type
  collect_cpu_metrics: true      # CPU time and percentage
  collect_lock_metrics: true     # Lock time and percentage
  collect_io_metrics: true       # Read/write I/O bytes
  collect_row_metrics: true      # Rows examined and returned

# Account-Specific Settings (optional)
# Define custom settings for specific AWS accounts
# Uncomment and customize as needed
#
# accounts:
#   lt-prd:
#     profile: lt-prd
#     region: ap-southeast-1
#     thresholds:
#       cpu:
#         warning: 60.0
#         critical: 85.0
#   
#   dm-prd:
#     profile: dm-prd
#     region: ap-southeast-1
#     thresholds:
#       memory:
#         warning: 85.0
#         critical: 95.0
#   
#   sp-uat:
#     profile: sp-uat
#     region: us-east-1

# Usage Examples:
#
# 1. Use this config file:
#    rds-diag --config config.yaml list
#
# 2. Override settings from command line:
#    rds-diag --config config.yaml --region us-east-1 list
#
# 3. Use default config location (~/.rds-diagnostics/config.yaml):
#    rds-diag list
